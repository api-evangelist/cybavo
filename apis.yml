name: CYBAVO
description: >-
  CYBAVO was a digital asset security company (founded 2018, Taipei/Singapore)
  providing institutional-grade cryptocurrency custody and wallet infrastructure.
  Its flagship CYBAVO Vault delivered MPC-based (Multi-Party Computation) custody
  with a policy/workflow engine, REST API, and client SDKs, alongside the CYBAVO
  Wallet App SDK for embedding secure private-key storage into mobile apps. Circle
  Internet Financial acquired CYBAVO in June 2022; the team and technology became
  the foundation of Circle Web3 Services and Circle Programmable Wallets. The
  cybavo.com developer surface has since been wound down (redirects to circle.com),
  but the first-party @cybavo Wallet/Auth SDKs remain published on npm and are
  maintained under Circle's circlefin GitHub organization.
